<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Admin - SYADZZ STORE</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    min-height:100vh;
    padding:20px;
    background:linear-gradient(
        135deg,
        #080812,
        #241044
    );
    color:#fff;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.hidden{
    display:none !important;
}


/* =========================
CARD
========================= */

.card{
    background:#19192d;
    border:1px solid #454565;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}


/* =========================
LOGIN
========================= */

.login-box{
    max-width:450px;
    margin:50px auto;
}

.title{
    text-align:center;
    color:#ffd900;
    margin:0 0 8px;
    font-size:30px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin-bottom:22px;
}

label{
    display:block;
    margin:14px 0 7px;
    font-weight:bold;
}

input,
select{
    width:100%;
    padding:13px;
    border:1px solid #50506b;
    border-radius:10px;
    background:#11111c;
    color:#fff;
    outline:none;
    font-size:14px;
}

input:focus,
select:focus{
    border-color:#ffd900;
}


/* =========================
BUTTON
========================= */

.btn{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn-primary{
    background:linear-gradient(
        90deg,
        #ffd900,
        #ff9f00
    );
    color:#111;
}

.btn-secondary{
    background:#303047;
    color:#fff;
}

.btn-danger{
    background:#8d2929;
    color:#fff;
}

.full{
    width:100%;
    margin-top:15px;
}


/* =========================
LOGIN MESSAGE
========================= */

.message{
    margin-top:12px;
    text-align:center;
    min-height:20px;
    line-height:1.5;
}

.connection{
    margin-top:15px;
    padding:10px;
    border-radius:9px;
    text-align:center;
    font-size:12px;
    background:#25253b;
    color:#aaa;
}

.connection.success{
    background:rgba(
        0,
        255,
        136,
        .08
    );
    border:1px solid #176b48;
    color:#00ff88;
}

.connection.error{
    background:rgba(
        255,
        80,
        80,
        .08
    );
    border:1px solid #6b2727;
    color:#ff7777;
}


/* =========================
TOPBAR
========================= */

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.topbar-title{
    color:#ffd900;
    font-size:24px;
    font-weight:bold;
}

.admin-email{
    color:#888;
    font-size:12px;
    margin-top:5px;
}

.topbar-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}


/* =========================
FILTER
========================= */

.filter-row{
    display:grid;
    grid-template-columns:1fr 220px;
    gap:10px;
}

.orders-count{
    margin-top:14px;
    color:#888;
    font-size:13px;
}


/* =========================
ORDER
========================= */

.order-card{
    background:#11111c;
    border:1px solid #35354e;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
}

.order-header{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
    margin-bottom:15px;
}

.order-code{
    color:#ffd900;
    font-size:18px;
    font-weight:bold;
}

.status{
    padding:7px 10px;
    border-radius:8px;
    background:#25253b;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.status.waiting{
    color:#ffd900;
}

.status.process{
    color:#58a6ff;
}

.status.done{
    color:#00ff88;
}


/* =========================
ORDER GRID
========================= */

.order-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.order-item{
    background:#19192d;
    border-radius:10px;
    padding:11px;
}

.order-label{
    color:#777;
    font-size:11px;
    margin-bottom:5px;
}

.order-value{
    font-size:14px;
    word-break:break-word;
}

.total{
    color:#ffd900;
    font-weight:bold;
}


/* =========================
ACTIONS
========================= */

.actions{
    display:flex;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}

.actions .btn{
    flex:1;
    min-width:150px;
}


/* =========================
EMPTY / LOADING / ERROR
========================= */

.empty{
    text-align:center;
    padding:30px;
    color:#777;
}

.loading{
    text-align:center;
    color:#aaa;
    padding:25px;
}

.error-box{
    text-align:center;
    padding:25px;
}

.error-title{
    color:#ff7777;
    font-weight:bold;
    margin-bottom:10px;
}

.error-text{
    color:#aaa;
    font-size:13px;
    line-height:1.6;
    word-break:break-word;
}


/* =========================
INFO
========================= */

.info{
    padding:12px;
    border-radius:10px;
    border:1px solid #4c4420;
    background:rgba(
        255,
        217,
        0,
        .06
    );
    color:#aaa;
    font-size:12px;
    line-height:1.6;
}


/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .filter-row{
        grid-template-columns:1fr;
    }

    .order-grid{
        grid-template-columns:1fr;
    }

    .order-header{
        flex-direction:column;
    }

    .actions{
        flex-direction:column;
    }

    .actions .btn{
        width:100%;
    }

    .topbar-buttons{
        width:100%;
    }

    .topbar-buttons .btn{
        flex:1;
    }

}

</style>

</head>


<body>

<div class="container">


<!-- =====================================================
LOGIN
===================================================== -->

<div
    id="loginPage"
    class="card login-box"
>

    <h1 class="title">
        SYADZZ STORE
    </h1>

    <div class="subtitle">
        ADMIN LOGIN
    </div>


    <label>
        Email Admin
    </label>

    <input
        type="email"
        id="adminEmail"
        value="rasyad0907@gmail.com"
        placeholder="Email admin"
        autocomplete="username"
    >


    <label>
        Password
    </label>

    <input
        type="password"
        id="adminPassword"
        placeholder="Password admin"
        autocomplete="current-password"
    >


    <button
        class="btn btn-primary full"
        onclick="loginAdmin()"
    >
        LOGIN ADMIN
    </button>


    <div
        id="loginMessage"
        class="message"
    ></div>


    <div
        id="connectionStatus"
        class="connection"
    >
        Mengecek koneksi Supabase...
    </div>

</div>


<!-- =====================================================
DASHBOARD
===================================================== -->

<div
    id="dashboardPage"
    class="hidden"
>


    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <div class="topbar-title">
                ADMIN SYADZZ STORE
            </div>

            <div
                id="adminEmailText"
                class="admin-email"
            ></div>

        </div>


        <div class="topbar-buttons">

            <button
                class="btn btn-secondary"
                onclick="loadOrders()"
            >
                REFRESH
            </button>


            <button
                class="btn btn-danger"
                onclick="logoutAdmin()"
            >
                LOGOUT
            </button>

        </div>

    </div>


    <!-- FILTER -->

    <div class="card">

        <h2
            style="
                color:#ffd900;
                margin-top:0;
            "
        >
            DAFTAR PESANAN
        </h2>


        <div class="filter-row">

            <input
                type="text"
                id="searchOrder"
                placeholder="Cari ID Order / username / game..."
                oninput="renderOrders()"
            >


            <select
                id="statusFilter"
                onchange="renderOrders()"
            >

                <option value="">
                    Semua Status
                </option>


                <option value="Menunggu di Proses">
                    Menunggu di Proses
                </option>


                <option value="Sedang Diproses">
                    Sedang Diproses
                </option>


                <option value="Selesai">
                    Selesai
                </option>

            </select>

        </div>


        <div
            id="ordersCount"
            class="orders-count"
        >
            0 pesanan
        </div>

    </div>


    <!-- DAFTAR PESANAN -->

    <div
        id="ordersContainer"
    ></div>


    <div class="info">

        Order baru akan masuk sebagai
        <b>Menunggu di Proses</b>.

        Saat admin menekan
        <b>MULAI JOKI</b>,
        status berubah menjadi
        <b>Sedang Diproses</b>.

        Setelah waktu selesai tercapai,
        status ditampilkan sebagai
        <b>Selesai</b>.

    </div>

</div>

</div>


<script>

/* =====================================================
SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://oyqdraemxlzqenbsdujh.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_uLjeOGdhxSQUjc4fCrkN9Q_QGabJxzu";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


let allOrders = [];


/* =====================================================
TEST SUPABASE
===================================================== */

async function testSupabaseConnection(){

    const status =
        document.getElementById(
            "connectionStatus"
        );


    try{

        const {
            error
        } =
            await supabaseClient
                .from("orders")
                .select(
                    "id",
                    {
                        count:"exact",
                        head:true
                    }
                );


        if(error){

            console.error(
                "Supabase:",
                error
            );


            status.className =
                "connection success";


            status.innerText =
                "Supabase terhubung.";


            return;

        }


        status.className =
            "connection success";


        status.innerText =
            "Supabase terhubung.";

    }
    catch(error){

        console.error(
            error
        );


        status.className =
            "connection error";


        status.innerText =
            "Gagal terhubung ke Supabase.";

    }

}


/* =====================================================
LOGIN ADMIN
===================================================== */

async function loginAdmin(){

    const email =
        document
            .getElementById(
                "adminEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "adminPassword"
            )
            .value;


    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!email){

        message.style.color =
            "#ff7777";


        message.innerText =
            "Masukkan email admin.";


        return;

    }


    if(!password){

        message.style.color =
            "#ff7777";


        message.innerText =
            "Masukkan password admin.";


        return;

    }


    message.style.color =
        "#aaa";


    message.innerText =
        "Sedang login...";


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


        if(error){

            console.error(
                "Login:",
                error
            );


            message.style.color =
                "#ff7777";


            message.innerText =
                "Login gagal: " +
                error.message;


            return;

        }


        if(
            !data ||
            !data.user
        ){

            message.style.color =
                "#ff7777";


            message.innerText =
                "Akun tidak ditemukan.";


            return;

        }


        await checkAdmin();

    }
    catch(error){

        console.error(
            error
        );


        message.style.color =
            "#ff7777";


        message.innerText =
            "Terjadi kesalahan: " +
            error.message;

    }

}


/* =====================================================
CHECK ADMIN
===================================================== */

async function checkAdmin(){

    const {
        data:{
            user
        }
    } =
        await supabaseClient
            .auth
            .getUser();


    const message =
        document.getElementById(
            "loginMessage"
        );


    if(!user){

        showLogin();


        message.style.color =
            "#ff7777";


        message.innerText =
            "Session login tidak ditemukan.";


        return;

    }


    const {
        data:isAdmin,
        error
    } =
        await supabaseClient.rpc(
            "is_current_user_admin"
        );


    if(error){

        console.error(
            "Admin RPC:",
            error
        );


        message.style.color =
            "#ff7777";


        message.innerText =
            "Gagal mengecek admin: " +
            error.message;


        return;

    }


    if(isAdmin !== true){

        await supabaseClient
            .auth
            .signOut();


        showLogin();


        message.style.color =
            "#ff7777";


        message.innerText =
            "Akun ini belum terdaftar sebagai admin.";


        return;

    }


    document
        .getElementById(
            "loginPage"
        )
        .classList
        .add(
            "hidden"
        );


    document
        .getElementById(
            "dashboardPage"
        )
        .classList
        .remove(
            "hidden"
        );


    document
        .getElementById(
            "adminEmailText"
        )
        .innerText =
            user.email;


    await loadOrders();

}


/* =====================================================
SHOW LOGIN
===================================================== */

function showLogin(){

    document
        .getElementById(
            "loginPage"
        )
        .classList
        .remove(
            "hidden"
        );


    document
        .getElementById(
            "dashboardPage"
        )
        .classList
        .add(
            "hidden"
        );

}


/* =====================================================
LOGOUT
===================================================== */

async function logoutAdmin(){

    await supabaseClient
        .auth
        .signOut();


    allOrders = [];


    showLogin();


    document
        .getElementById(
            "adminPassword"
        )
        .value =
            "";


    document
        .getElementById(
            "loginMessage"
        )
        .innerText =
            "";

}


/* =====================================================
LOAD ORDERS
===================================================== */

async function loadOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    container.innerHTML =
        `
        <div class="card loading">
            Memuat pesanan...
        </div>
        `;


    try{

        const {
            data,
            error
        } =
            await supabaseClient
                .from("orders")
                .select("*")
                .order(
                    "created_at",
                    {
                        ascending:false
                    }
                );


        if(error){

            console.error(
                "LOAD ORDERS:",
                error
            );


            container.innerHTML =
                `
                <div class="card error-box">

                    <div class="error-title">
                        GAGAL MEMUAT PESANAN
                    </div>

                    <div class="error-text">
                        ${escapeHtml(
                            error.message
                        )}
                    </div>

                    <button
                        class="btn btn-secondary"
                        style="margin-top:15px;"
                        onclick="loadOrders()"
                    >
                        COBA LAGI
                    </button>

                </div>
                `;


            return;

        }


        allOrders =
            data || [];


        renderOrders();

    }
    catch(error){

        console.error(
            error
        );


        container.innerHTML =
            `
            <div class="card error-box">

                <div class="error-title">
                    TERJADI KESALAHAN
                </div>

                <div class="error-text">
                    ${escapeHtml(
                        error.message ||
                        "Kesalahan tidak diketahui"
                    )}
                </div>

                <button
                    class="btn btn-secondary"
                    style="margin-top:15px;"
                    onclick="loadOrders()"
                >
                    COBA LAGI
                </button>

            </div>
            `;

    }

}


/* =====================================================
STATUS AKTUAL
===================================================== */

function getActualStatus(
    order
){

    if(
        order.status ===
            "Sedang Diproses" &&
        order.finish_at
    ){

        if(
            new Date() >=
            new Date(
                order.finish_at
            )
        ){

            return "Selesai";

        }

    }


    return order.status;

}


/* =====================================================
STATUS CLASS
===================================================== */

function getStatusClass(
    status
){

    if(
        status ===
        "Selesai"
    ){

        return "done";

    }


    if(
        status ===
        "Sedang Diproses"
    ){

        return "process";

    }


    return "waiting";

}


/* =====================================================
RENDER
===================================================== */

function renderOrders(){

    const container =
        document.getElementById(
            "ordersContainer"
        );


    const search =
        document
            .getElementById(
                "searchOrder"
            )
            .value
            .trim()
            .toLowerCase();


    const filter =
        document
            .getElementById(
                "statusFilter"
            )
            .value;


    const filtered =
        allOrders.filter(
            function(order){

                const actualStatus =
                    getActualStatus(
                        order
                    );


                const searchable = (

                    (order.order_code || "") +

                    " " +

                    (order.username_roblox || "") +

                    " " +

                    (order.game_map || "") +

                    " " +

                    (order.package_name || "") +

                    " " +

                    (order.whatsapp_customer || "")

                ).toLowerCase();


                return (

                    (!search ||
                        searchable.includes(
                            search
                        )
                    )

                    &&

                    (!filter ||
                        actualStatus ===
                        filter
                    )

                );

            }
        );


    document
        .getElementById(
            "ordersCount"
        )
        .innerText =
            filtered.length +
            " pesanan";


    if(
        filtered.length === 0
    ){

        container.innerHTML =
            `
            <div class="card empty">
                Belum ada pesanan.
            </div>
            `;


        return;

    }


    container.innerHTML =
        filtered
            .map(
                createOrderCard
            )
            .join("");

}


/* =====================================================
ORDER CARD
===================================================== */

function createOrderCard(
    order
){

    const status =
        getActualStatus(
            order
        );


    const statusClass =
        getStatusClass(
            status
        );


    let action = "";


    if(
        status ===
        "Menunggu di Proses"
    ){

        action +=
            `
            <button
                class="btn btn-primary"
                onclick="startOrder('${order.id}')"
            >
                MULAI JOKI
            </button>
            `;

    }


    if(
        status ===
        "Sedang Diproses"
    ){

        action +=
            `
            <button
                class="btn btn-secondary"
                onclick="loadOrders()"
            >
                REFRESH STATUS
            </button>
            `;

    }


    action +=
        `
        <button
            class="btn btn-danger"
            onclick="deleteOrder('${order.id}')"
        >
            HAPUS PESANAN
        </button>
        `;


    return `

    <div class="order-card">


        <div class="order-header">

            <div>

                <div class="order-code">

                    ${escapeHtml(
                        order.order_code
                    )}

                </div>


                <div class="admin-email">

                    Dibuat:
                    ${formatDate(
                        order.created_at
                    )}

                </div>

            </div>


            <div
                class="status ${statusClass}"
            >

                ${escapeHtml(
                    status
                )}

            </div>

        </div>


        <div class="order-grid">


            <div class="order-item">

                <div class="order-label">
                    Paket
                </div>

                <div class="order-value">
                    ${escapeHtml(
                        order.package_name
                    )}
                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Quantity
                </div>

                <div class="order-value">

                    ${order.quantity}
                    Hari

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Username Roblox
                </div>

                <div class="order-value">

                    ${escapeHtml(
                        order.username_roblox
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    WhatsApp Customer
                </div>

                <div class="order-value">

                    ${escapeHtml(
                        order.whatsapp_customer
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Game / Map
                </div>

                <div class="order-value">

                    ${escapeHtml(
                        order.game_map
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Pembayaran
                </div>

                <div class="order-value">

                    ${escapeHtml(
                        order.payment_method
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Subtotal
                </div>

                <div class="order-value">

                    ${rupiah(
                        order.subtotal
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Promo
                </div>

                <div class="order-value">

                    ${escapeHtml(
                        order.promo_code ||
                        "-"
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Diskon
                </div>

                <div class="order-value">

                    ${Number(
                        order.discount_percent ||
                        0
                    )}%

                    -

                    ${rupiah(
                        order.discount_amount ||
                        0
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    TOTAL BAYAR
                </div>

                <div class="order-value total">

                    ${rupiah(
                        order.total_amount
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Mulai Joki
                </div>

                <div class="order-value">

                    ${formatDate(
                        order.started_at
                    )}

                </div>

            </div>


            <div class="order-item">

                <div class="order-label">
                    Selesai Otomatis
                </div>

                <div class="order-value">

                    ${formatDate(
                        order.finish_at
                    )}

                </div>

            </div>


        </div>


        <div class="actions">

            ${action}

        </div>


    </div>

    `;

}


/* =====================================================
MULAI JOKI
===================================================== */

async function startOrder(
    orderId
){

    const order =
        allOrders.find(
            function(item){

                return item.id ===
                    orderId;

            }
        );


    if(!order){

        alert(
            "Order tidak ditemukan."
        );

        return;

    }


    if(
        order.status !==
        "Menunggu di Proses"
    ){

        alert(
            "Order ini sudah diproses."
        );

        return;

    }


    const yes =
        confirm(
            "Mulai joki " +
            order.order_code +
            " sekarang?"
        );


    if(!yes){

        return;

    }


    const startedAt =
        new Date();


    const finishAt =
        new Date(

            startedAt.getTime() +

            Number(
                order.duration_hours
            ) *

            60 *

            60 *

            1000

        );


    try{

        const {
            error
        } =
            await supabaseClient
                .from("orders")
                .update({

                    status:
                        "Sedang Diproses",

                    started_at:
                        startedAt.toISOString(),

                    finish_at:
                        finishAt.toISOString()

                })
                .eq(
                    "id",
                    orderId
                );


        if(error){

            console.error(
                "Start order:",
                error
            );


            alert(
                "Gagal memulai joki:\n" +
                error.message
            );


            return;

        }


        alert(
            "Joki berhasil dimulai."
        );


        await loadOrders();

    }
    catch(error){

        console.error(
            error
        );


        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
HAPUS PESANAN
===================================================== */

async function deleteOrder(
    orderId
){

    const order =
        allOrders.find(
            function(item){

                return item.id ===
                    orderId;

            }
        );


    if(!order){

        alert(
            "Pesanan tidak ditemukan."
        );

        return;

    }


    const yakin =
        confirm(

            "Yakin ingin menghapus pesanan " +

            order.order_code +

            "?\n\n" +

            "Pesanan yang dihapus tidak bisa dikembalikan."

        );


    if(!yakin){

        return;

    }


    try{

        const {
            error
        } =
            await supabaseClient
                .from("orders")
                .delete()
                .eq(
                    "id",
                    orderId
                );


        if(error){

            console.error(
                "Delete order:",
                error
            );


            alert(
                "Gagal menghapus pesanan:\n" +
                error.message
            );


            return;

        }


        alert(
            "Pesanan " +
            order.order_code +
            " berhasil dihapus."
        );


        await loadOrders();

    }
    catch(error){

        console.error(
            error
        );


        alert(
            "Terjadi kesalahan:\n" +
            error.message
        );

    }

}


/* =====================================================
RUPIAH
===================================================== */

function rupiah(
    value
){

    return "Rp" +

        Number(
            value || 0
        ).toLocaleString(
            "id-ID"
        );

}


/* =====================================================
TANGGAL
===================================================== */

function formatDate(
    value
){

    if(!value){

        return "-";

    }


    return new Date(
        value
    ).toLocaleString(
        "id-ID",
        {

            timeZone:
                "Asia/Jakarta",

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit",

            second:
                "2-digit"

        }
    );

}


/* =====================================================
ESCAPE
===================================================== */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
