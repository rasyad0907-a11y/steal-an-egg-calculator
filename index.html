<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculator Speed Steal An Egg</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 15px;
    background: linear-gradient(135deg, #080812, #241044);
    color: white;
}

.container {
    width: 100%;
    max-width: 700px;
    margin: auto;
}

h1 {
    margin: 0 0 8px;
    text-align: center;
    color: #ffd900;
    font-size: 32px;
}

.subtitle {
    margin-bottom: 25px;
    text-align: center;
    color: #aaa;
}

.card {
    margin-bottom: 20px;
    padding: 22px;
    background: #19192d;
    border: 1px solid #454565;
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
}

label {
    display: block;
    margin: 15px 0 7px;
    font-weight: bold;
}

select,
input {
    width: 100%;
    padding: 14px;

    background: #11111c;
    color: white;

    border: 2px solid #44445c;
    border-radius: 10px;

    font-size: 16px;
    outline: none;
}

select:focus,
input:focus {
    border-color: #8b5cf6;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 16px;

    border: none;
    border-radius: 12px;

    background: linear-gradient(90deg, #7c3aed, #ec4899);

    color: white;
    font-size: 18px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    opacity: 0.92;
}

.result {
    display: none;
}

.result h2 {
    margin-top: 0;
    text-align: center;
    color: #00ff88;
}

.status {
    margin-bottom: 15px;
    text-align: center;
    font-size: 13px;
}

.status.exact {
    color: #00ff88;
}

.status.estimate {
    color: #ffd900;
}

.row {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;

    margin-top: 9px;
    padding: 14px;

    background: #11111c;
    border-radius: 10px;
}

.row span:first-child {
    color: #ccc;
}

.row span:last-child {
    color: #00ff88;
    font-weight: bold;
    text-align: right;
}

.final {
    margin-top: 20px;
    padding: 25px;

    background: #21133d;
    border: 2px solid #8b5cf6;
    border-radius: 15px;

    text-align: center;
}

.final-title {
    color: #aaa;
    font-size: 15px;
}

.total {
    margin-top: 8px;
    color: #ffd900;
    font-size: 42px;
    font-weight: bold;
}

.tiktok-box {
    display: flex;
    justify-content: center;
    align-items: center;

    margin-top: 20px;
    padding: 15px 20px;

    background: #11111c;
    border: 1px solid #454565;
    border-radius: 12px;
}

.tiktok-link {
    display: flex;
    align-items: center;
    gap: 12px;

    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

.tiktok-logo {
    width: 30px;
    height: 34px;
}

.footer {
    margin-top: 20px;
    color: #777;
    text-align: center;
    font-size: 12px;
}

@media (max-width: 500px) {

    h1 {
        font-size: 26px;
    }

    .total {
        font-size: 36px;
    }

    .row {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>⚡ CALCULATOR SPEED</h1>

    <div class="subtitle">
        Steal An Egg
    </div>


    <!-- INPUT -->

    <div class="card">

        <label>🏃 Treadmill</label>

        <select id="treadmill">

            <option value="2" selected>
                Treadmill — +2
            </option>

            <option value="5">
                Sci-Fi Treadmill — +5
            </option>

            <option value="12">
                Flame Treadmill — +12
            </option>

            <option value="30">
                Celebrity Treadmill — +30
            </option>

            <option value="80">
                Golden Treadmill — +80
            </option>

            <option value="100">
                Mythic Treadmill — +100
            </option>

            <option value="200">
                Lucky Block Treadmill — +200
            </option>

            <option value="500">
                Hacker Treadmill — +500
            </option>

            <option value="1000">
                Demonic Treadmill — +1K
            </option>

            <option value="2000">
                Angelic Treadmill — +2K
            </option>

            <option value="3000">
                Astral Treadmill — +3K
            </option>

        </select>


        <label>✨ Trail</label>

        <select id="trail">

            <option value="1.5" selected>
                Abu-abu — x1.5
            </option>

            <option value="2">
                Hijau — x2
            </option>

            <option value="2.5">
                Biru — x2.5
            </option>

            <option value="3">
                Ungu — x3
            </option>

            <option value="3.5">
                Emas — x3.5
            </option>

            <option value="4">
                Merah — x4
            </option>

            <option value="5">
                Galaksi — x5
            </option>

            <option value="7">
                Rahasia — x7
            </option>

            <option value="10">
                Abadi — x10
            </option>

            <option value="14">
                Ilahi — x14
            </option>

            <option value="20">
                Bunga Bulan — x20
            </option>

        </select>


        <label>🚀 Multiplier</label>

        <select id="multiplier">

            <option value="1" selected>x1</option>
            <option value="2">x2</option>
            <option value="4">x4</option>
            <option value="8">x8</option>
            <option value="16">x16</option>
            <option value="32">x32</option>
            <option value="64">x64</option>
            <option value="128">x128</option>
            <option value="256">x256</option>
            <option value="512">x512</option>
            <option value="1000">x1K</option>
            <option value="2000">x2K</option>
            <option value="3000">x3K</option>
            <option value="4000">x4K</option>

        </select>


        <label>⏰ AFK Berapa Jam?</label>

        <input
            type="number"
            id="hours"
            min="0.01"
            step="0.01"
            value="1"
            placeholder="Contoh: 1"
        >


        <button onclick="hitung()">
            ⚡ HITUNG SEKARANG
        </button>

    </div>


    <!-- HASIL -->

    <div class="card result" id="result">

        <h2>📊 HASIL SPEED</h2>

        <div class="status" id="status"></div>


        <div class="row">
            <span>🏃 Treadmill</span>
            <span id="outTreadmill"></span>
        </div>

        <div class="row">
            <span>✨ Trail</span>
            <span id="outTrail"></span>
        </div>

        <div class="row">
            <span>🚀 Multiplier</span>
            <span id="outMultiplier"></span>
        </div>

        <div class="row">
            <span>⏱️ Step / Detik</span>
            <span id="outSteps"></span>
        </div>

        <div class="row">
            <span>💰 Gain / Step</span>
            <span id="outStep"></span>
        </div>

        <div class="row">
            <span>⚡ Gain / Detik</span>
            <span id="outSecond"></span>
        </div>

        <div class="row">
            <span>🔥 Gain / Menit</span>
            <span id="outMinute"></span>
        </div>

        <div class="row">
            <span>💎 Gain / Jam</span>
            <span id="outHour"></span>
        </div>

        <div class="row">
            <span>⏰ Waktu AFK</span>
            <span id="outHours"></span>
        </div>


        <div class="final">

            <div class="final-title">
                TOTAL HASIL AFK
            </div>

            <div class="total" id="outTotal">
                0
            </div>

        </div>


        <!-- TIKTOK -->

        <div class="tiktok-box">

            <a
                class="tiktok-link"
                href="https://www.tiktok.com/@syadzz011"
                target="_blank"
                rel="noopener noreferrer"
            >

                <svg
                    class="tiktok-logo"
                    viewBox="0 0 24 24"
                    fill="white"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <path
                        d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.9 2.9 0 1 1-2-2.77V9.38a6.27 6.27 0 1 0 5.48 6.29V8.41a8.16 8.16 0 0 0 4.79 1.52V6.5a4.84 4.84 0 0 1-1.05-.1z"
                    />

                </svg>

                <span>
                    syadzz011
                </span>

            </a>

        </div>

    </div>


    <div class="footer">
        Kalkulator Speed • Steal an Egg • Syad
    </div>

</div>


<script>

/*
====================================================
PATOKAN STEP
====================================================

Berdasarkan pengukuran 10 detik sebelumnya:
sekitar 22 step/detik.
====================================================
*/

const STEPS_PER_SECOND = 22;


/*
====================================================
DATA ASLI GAME
====================================================

Data ini dipakai langsung dan TIDAK diestimasi.
====================================================
*/

const GAME_DATA = [

    /* +1K + x10 */

    {
        treadmill: 1000,
        trail: 10,
        multiplier: 1,
        gain: 10000
    },

    {
        treadmill: 1000,
        trail: 10,
        multiplier: 4,
        gain: 13000
    },

    {
        treadmill: 1000,
        trail: 10,
        multiplier: 8,
        gain: 17000
    },

    {
        treadmill: 1000,
        trail: 10,
        multiplier: 128,
        gain: 137000
    },


    /* +1K + x14 */

    {
        treadmill: 1000,
        trail: 14,
        multiplier: 8,
        gain: 21000
    },


    /* +2K + x14 */

    {
        treadmill: 2000,
        trail: 14,
        multiplier: 1,
        gain: 28000
    },

    {
        treadmill: 2000,
        trail: 14,
        multiplier: 8,
        gain: 42000
    },

    {
        treadmill: 2000,
        trail: 14,
        multiplier: 32,
        gain: 90000
    },

    {
        treadmill: 2000,
        trail: 14,
        multiplier: 128,
        gain: 282000
    },

    {
        treadmill: 2000,
        trail: 14,
        multiplier: 256,
        gain: 538000
    },


    /* +2K + x20 */

    {
        treadmill: 2000,
        trail: 20,
        multiplier: 1,
        gain: 40000
    },


    /* +3K + x20 + x32 */

    {
        treadmill: 3000,
        trail: 20,
        multiplier: 32,
        gain: 153000
    },


    /* +3K + x14 + x2K */

    {
        treadmill: 3000,
        trail: 14,
        multiplier: 2000,
        gain: 6180000
    },


    /* +3K + x20 + x2K */

    {
        treadmill: 3000,
        trail: 20,
        multiplier: 2000,
        gain: 6200000
    }

];


/*
====================================================
CARI DATA PERSIS
====================================================
*/

function findExactData(
    treadmill,
    trail,
    multiplier
) {

    return GAME_DATA.find(function(data) {

        return (
            data.treadmill === treadmill &&
            data.trail === trail &&
            data.multiplier === multiplier
        );

    });

}


/*
====================================================
RUMUS DASAR UNTUK ESTIMASI
====================================================

Pola yang cocok untuk data rendah:
Treadmill × (Trail + Multiplier - 1)

Contoh:

2 × (1.5 + 1 - 1)
= 3

2K × (14 + 128 - 1)
= 282K

2K × (14 + 256 - 1)
= 538K

Untuk multiplier tinggi,
kita beri koreksi kecil berdasarkan data x2K.
====================================================
*/

function baseEstimate(
    treadmill,
    trail,
    multiplier
) {

    return (
        treadmill *
        (
            trail +
            multiplier -
            1
        )
    );

}


/*
====================================================
FAKTOR KOREKSI MULTIPLIER TINGGI
====================================================

Dari data:

+3K + x14 + x2K
rumus dasar = 6.039M
game        = 6.18M

+3K + x20 + x2K
rumus dasar = 6.057M
game        = 6.2M

Koreksinya sekitar 1.023.

Kita naikkan koreksi perlahan dari x256
menuju x2K.

Di atas x2K koreksi ditahan.
====================================================
*/

function getHighMultiplierCorrection(
    multiplier
) {

    if (multiplier <= 256) {
        return 1;
    }


    const start = 256;
    const end = 2000;


    const targetCorrection =
        1.0233;


    if (multiplier >= end) {
        return targetCorrection;
    }


    const progress =
        (
            multiplier - start
        ) /
        (
            end - start
        );


    return (
        1 +
        (
            targetCorrection - 1
        ) *
        progress
    );

}


/*
====================================================
ESTIMASI
====================================================
*/

function estimateGain(
    treadmill,
    trail,
    multiplier
) {

    let gain =
        baseEstimate(
            treadmill,
            trail,
            multiplier
        );


    const correction =
        getHighMultiplierCorrection(
            multiplier
        );


    gain *= correction;


    /*
    Untuk x3K dan x4K,
    jangan membuat estimasi melonjak tanpa batas.

    Gunakan pola maksimum x2K sebagai dasar.
    */

    if (multiplier > 2000) {

        const x2kBase =
            baseEstimate(
                treadmill,
                trail,
                2000
            );


        const x2kEstimate =
            x2kBase *
            getHighMultiplierCorrection(
                2000
            );


        /*
        Kenaikan setelah x2K dibuat konservatif.
        */

        const extra =
            Math.pow(
                multiplier / 2000,
                0.85
            );


        gain =
            x2kEstimate *
            extra;

    }


    return Math.round(gain);

}


/*
====================================================
GAIN PER STEP
====================================================
*/

function getGainPerStep(
    treadmill,
    trail,
    multiplier
) {

    const exact =
        findExactData(
            treadmill,
            trail,
            multiplier
        );


    if (exact) {

        return {
            gain: exact.gain,
            exact: true
        };

    }


    return {
        gain:
            estimateGain(
                treadmill,
                trail,
                multiplier
            ),

        exact: false
    };

}


/*
====================================================
FORMAT ANGKA
====================================================

PENTING:
6200000 -> 6.2M
6180000 -> 6.18M
538000  -> 538K
282000  -> 282K

Tidak dibulatkan menjadi 6M.
====================================================
*/

function formatNumber(number) {

    if (!Number.isFinite(number)) {
        return "0";
    }


    const units = [
        "",
        "K",
        "M",
        "B",
        "T",
        "Qa",
        "Qi",
        "Sx",
        "Sp",
        "Oc",
        "No",
        "Dc"
    ];


    let unit = 0;

    let value =
        Math.abs(number);


    while (
        value >= 1000 &&
        unit < units.length - 1
    ) {

        value /= 1000;
        unit++;

    }


    /*
    Angka tanpa satuan
    */

    if (unit === 0) {

        return Number.isInteger(number)
            ? number.toLocaleString("id-ID")
            : number.toLocaleString(
                "id-ID",
                {
                    maximumFractionDigits: 2
                }
            );

    }


    /*
    Selalu simpan maksimal 2 desimal.
    */

    let result =
        value.toFixed(2);


    /*
    Buang nol di belakang.
    */

    result =
        result.replace(
            /0+$/,
            ""
        );


    result =
        result.replace(
            /\.$/,
            ""
        );


    if (number < 0) {
        result = "-" + result;
    }


    return (
        result +
        units[unit]
    );

}


/*
====================================================
HITUNG
====================================================
*/

function hitung() {

    const treadmill =
        Number(
            document.getElementById(
                "treadmill"
            ).value
        );


    const trail =
        Number(
            document.getElementById(
                "trail"
            ).value
        );


    const multiplier =
        Number(
            document.getElementById(
                "multiplier"
            ).value
        );


    const hours =
        Number(
            document.getElementById(
                "hours"
            ).value
        );


    if (
        !Number.isFinite(hours) ||
        hours <= 0
    ) {

        alert(
            "Masukkan jumlah jam AFK yang benar!"
        );

        return;
    }


    /*
    Gain / Step
    */

    const result =
        getGainPerStep(
            treadmill,
            trail,
            multiplier
        );


    const gainPerStep =
        result.gain;


    /*
    Gain / Detik
    */

    const gainPerSecond =
        gainPerStep *
        STEPS_PER_SECOND;


    /*
    Gain / Menit
    */

    const gainPerMinute =
        gainPerSecond *
        60;


    /*
    Gain / Jam
    */

    const gainPerHour =
        gainPerSecond *
        3600;


    /*
    Total AFK
    */

    const total =
        gainPerHour *
        hours;


    /*
    Status
    */

    const status =
        document.getElementById(
            "status"
        );


    if (result.exact) {

        status.innerText =
            "✅ Data asli dari game";

        status.className =
            "status exact";

    }
    else {

        status.innerText =
            "≈ Perkiraan berdasarkan data game";

        status.className =
            "status estimate";

    }


    /*
    OUTPUT
    */

    document.getElementById(
        "outTreadmill"
    ).innerText =
        "+" +
        formatNumber(
            treadmill
        );


    document.getElementById(
        "outTrail"
    ).innerText =
        "x" +
        trail;


    document.getElementById(
        "outMultiplier"
    ).innerText =
        "x" +
        formatNumber(
            multiplier
        );


    document.getElementById(
        "outSteps"
    ).innerText =
        STEPS_PER_SECOND +
        " step";


    document.getElementById(
        "outStep"
    ).innerText =
        formatNumber(
            gainPerStep
        );


    document.getElementById(
        "outSecond"
    ).innerText =
        formatNumber(
            gainPerSecond
        );


    document.getElementById(
        "outMinute"
    ).innerText =
        formatNumber(
            gainPerMinute
        );


    document.getElementById(
        "outHour"
    ).innerText =
        formatNumber(
            gainPerHour
        );


    document.getElementById(
        "outHours"
    ).innerText =
        hours +
        " jam";


    document.getElementById(
        "outTotal"
    ).innerText =
        formatNumber(
            total
        );


    document.getElementById(
        "result"
    ).style.display =
        "block";

}


/*
====================================================
HITUNG OTOMATIS
====================================================
*/

window.addEventListener(
    "load",
    function() {

        hitung();

    }
);

</script>

</body>
</html>
